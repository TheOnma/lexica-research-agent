# Local development stack for Lexica / research-agent.
#
#   cp .env.example .env   # fill in your API keys
#   docker compose up --build
#
# Then open http://localhost:3000 (frontend) — the API is at http://localhost:8000.
#
# The api and worker containers share ./data on the host:
#   - CHROMA_PERSIST_DIR=/app/data/chroma  — the vector database
#   - UPLOAD_DIR=/app/data/uploads         — staged uploads the worker ingests
# Both containers must reach the same files for async ingestion to work.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn backend.routes:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A rag.celery_app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: pnpm dev
    environment:
      # Injected at runtime; the browser reaches the API via the host port.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
